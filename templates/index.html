<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FriendshipAI</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

</head>

<body>

    <!-- BACKGROUND -->

    <div class="bg-circle one"></div>
    <div class="bg-circle two"></div>

    <!-- MAIN -->

    <div class="container">

        <!-- LEFT SECTION -->

        <div class="left-section">

            <div class="badge">

                ✨ AI Friendship Detection System

            </div>

            <h1>

                Meet Your <br>

                <span>AI Friendship</span> Robot

            </h1>

            <p>

                Analyze friendship emotions, trust,
                toxicity and behavior using Artificial Intelligence.

            </p>

            <a href="/analyze">

    <button class="start-btn">

        🚀 Start Analysis

    </button>

</a>

        </div>

        <!-- RIGHT SECTION -->

        <div class="right-section">

            <div class="robot-container">
                <div class="talk-box">

    Hey 👋 <br>

    I am <span>FriendshipAI</span> Robot

</div>

                <!-- ROBOT -->

                <div class="robot">

                    <!-- HEART -->

                    <div class="heart"></div>

                    <!-- ANTENNA -->

                    <div class="robot-antenna"></div>

                    <!-- HEAD -->

                    <div class="robot-head">

                        <!-- EARS -->

                        <div class="ear left-ear"></div>
                        <div class="ear right-ear"></div>

                        <!-- EYES -->

                        <div class="robot-eyes">

                            <div class="eye"></div>
                            <div class="eye"></div>

                        </div>

                        <!-- SMILE -->

                        <div class="robot-smile"></div>

                        <!-- BLUSH -->

                        <div class="robot-blush left"></div>
                        <div class="robot-blush right"></div>

                    </div>

                    <!-- BODY -->

                    <div class="robot-body">

                        <div class="belly">

                            <div class="light"></div>

                        </div>

                    </div>

                    <!-- ARMS -->

                    <div class="arm left-arm"></div>
                    <div class="arm right-arm"></div>

                    <!-- LEGS -->

                    <div class="legs">

                        <div class="leg"></div>
                        <div class="leg"></div>

                    </div>

                </div>

            </div>

        </div>

    </div>

</body>

</html>
